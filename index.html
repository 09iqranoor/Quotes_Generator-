<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dad Jokes Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Urbanist', sans-serif;
    }

    html {
      font-size: 62.5%;  
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #fff;
    }

    .container {
      background: #fff;
      color: #000;
      padding: 4rem 5rem;
      border-radius: 1rem;
      text-align: center;
      width: 100%;
      max-width: 50rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      color: #2c3e50;
    }

    .api_body {
      font-size: 1.8rem;
      margin: 2rem 0;
      padding: 2rem;
      background-color: #f4f4f4;
      border-left: 5px solid #20a9bb;
      border-radius: 0.5rem;
      color: #333;
    }

    button {
      padding: 1.2rem 3rem;
      font-size: 1.6rem;
      background-color: #20a9bb;
      color: #fff;
      border: none;
      border-radius: 5rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #1b7f91;
      transform: translateY(-3px);
    }

    button:active {
      transform: scale(0.98);
    }

    @media (max-width: 600px) {
      .container {
        padding: 3rem 2rem;
      }

      h1 {
        font-size: 2.4rem;
      }
    }
  </style>
</head>

<body>
  <div class="container"> 
    <h1>Quotes Generator</h1>
    <section class="api_body">Click the button to load a Quote!</section>
    <section class="err"> </section>
    <button id="fetchquote">Get Another Quote</button>
  </div>
</body>


<script src="script.js"></script>
</html>
